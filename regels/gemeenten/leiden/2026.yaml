    citaat:
      kop: "Gemeente Leiden, Individuele inkomenstoeslag (voorwaarden en bedragen)"
      tekst: "U woont in Leiden. U bent 23 jaar of ouder, maar u hebt nog niet de AOW-leeftijd bereikt. U hebt een langdurig laag inkomen. Dat is als u 5 jaar (of langer) een inkomen hebt van maximaal 100% van de geldende bijstandsnorm. U kreeg in de afgelopen 12 maanden geen individuele inkomenstoeslag. […] alleenstaande: € 462,00 alleenstaande ouder: € 577,00 gehuwden: € 635,00"
      versie: "geraadpleegd op 8 november 2026"
  - id: leiden.iit.minimumleeftijd
