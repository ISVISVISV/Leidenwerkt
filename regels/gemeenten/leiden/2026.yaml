  - id: leiden.czm.inkomensgrens
    omschrijving: Collectieve zorgverzekering voor minima en bijdrage zwemabonnement — inkomen tot dit deel van de bijstandsnorm (art. 11 lid 1 en art. 12 lid 1 Beleidsregels bijzondere bijstand 2022)
    eenheid: breuk
    waarde: { soort: percentage, breuk: "1.20" }
    status: geverifieerd
    bron: *bijzondere_bijstand
    citaat:
      kop: "Leiden, beleidsregels bijzondere bijstand 2022, art. 11 lid 1 en art. 12 lid 1"
      tekst: "Aan inwoners met een inkomen tot 120 procent van de voor hen van toepassing zijnde bijstandsnorm kan door het college periodieke bijzondere bijstand worden verstrekt voor (een deel van) de premie voor een collectieve aanvullende zorgverzekering, waarvoor het college een overeenkomst gesloten heeft met een zorgverzekeraar. […] Aan inwoners met een inkomen tot 120 procent van de voor hen van toepassing zijnde bijstandsnorm kunnen de kosten van een seizoenabonnement voor zwembad De Vliet of recreatiezwembad De Zijl te Leiden worden vergoed."
      versie: "geldend vanaf 1 april 2022"
  - id: leiden.gemeentepolis.inkomensgrens
    omschrijving: Gemeentepolis (collectieve zorgverzekering van de gemeente) — inkomen tot dit deel van het sociaal minimum
    eenheid: breuk
    waarde: { soort: percentage, breuk: "1.20" }
    status: geverifieerd
    bron:
      titel: Gemeente Leiden, Collectieve aanvullende zorgverzekering
      url: https://gemeente.leiden.nl/inwoners-en-ondernemers/uitkering-en-inkomen/hulp-bij-laag-inkomen/collectieve-aanvullende-zorgverzekering/
      geraadpleegd_op: 2026-11-12
    citaat:
      kop: "Gemeente Leiden, Collectieve aanvullende zorgverzekering"
      tekst: "De gemeentepolis is een zorgverzekering van Zorg en Zekerheid en de gemeente. […] De Gemeentepolis is voor inwoners van Leiden met een inkomen tot 120% van het sociaal minimum. […] Alleenstaand – 21 jaar tot AOW-leeftijd € 1.618,18 Getrouwd of samenwonend – 21 tot AOW-leeftijd € 2.311,68 Alleenstaand, in instelling € 512,36 […] Inkomen van 120% van het sociaal minimum, zonder vakantiegeld."
      versie: "geraadpleegd op 12 november 2026"
    notitie: "De pagina noemt dezelfde maximale netto-inkomens per maand als het Volwassenenfonds: alleenstaand € 1.618,18, getrouwd of samenwonend € 2.311,68, alleenstaand in een instelling € 512,36 (120% × 95% van de norm van art. 23 lid 1 Pw, zonder verhoging). Voor een paar in een instelling noemt de pagina geen bedrag; de app geeft dan geen melding. De app gebruikt daarom hetzelfde sociaal minimum als bij het Volwassenenfonds."
  - id: leiden.kwijtschelding.kosten_van_bestaan
    omschrijving: Kwijtschelding gemeentelijke belastingen — kosten van bestaan als deel van de bijstandsnorm (art. 2 lid 1 Verordening kwijtschelding gemeentelijke belastingen Leiden 2025)
    eenheid: breuk
