      tekst: "De verlaging in verband met de woonsituatie, als bedoeld in artikel 27 van de wet, bedraagt: a. als de belanghebbende (zelf) geen woonkosten betaalt: 10% van de gehuwden norm. b. als de woonkosten van de belanghebbende (zelf) minder dan 10% van de gehuwden norm zijn: het verschil tussen de daadwerkelijke woonkosten en 10% van de gehuwden norm. c. als belanghebbende (zelf) geen woonlasten betaalt: 9 % van de gehuwdennorm. d. als belanghebbende (zelf) geen woonkosten betaalt en geen woonlasten heeft; 19 % van de gehuwdennorm."
