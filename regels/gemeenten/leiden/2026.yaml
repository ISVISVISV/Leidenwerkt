    notitie: "De regeling zegt niet wat onder het WSM valt en noemt de kostendelersnorm niet. De app volgt de tabellen van de gemeente op gemeente.leiden.nl (Hulp bij kosten sport en cultuur), die een vast bedrag per soort huishouden geven, zonder kostendelersnorm: de norm voor een alleenstaande (ook eenoudergezin) of voor gehuwden. Controle: het 140%-bedrag voor een eenoudergezin daar (€ 1.864,00 zonder vakantiegeld) is 140% × 95% × € 1.401,50."
