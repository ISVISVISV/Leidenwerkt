    citaat:
      kop: "Leiden, Verordening kwijtschelding gemeentelijke belastingen 2025, art. 1 en art. 2 lid 1"
      tekst: "Kwijtschelding wordt verleend voor de volgende belastingaanslagen: a. Eigenarenbelasting (woningen) van de onroerende-zaakbelastingen; b. Afvalstoffenheffing; c. Riool- en waterzorgheffing van woningen; […] Bij de kwijtschelding wordt in afwijking van artikel 16, eerste en tweede lid van de Uitvoeringsregeling Invorderingswet 1990 het percentage voor de berekening van de kosten van bestaan gesteld op 100%."
      versie: "geldend vanaf 1 januari 2025"
    notitie: De app rekent de kwijtschelding niet uit; ze meldt alleen dat die kan vervallen als het inkomen boven de bijstandsnorm komt.
  - id: leiden.volwassenenfonds.inkomensgrens
    omschrijving: Volwassenenfonds Sport & Cultuur — inkomen tot dit deel van het sociaal minimum
    eenheid: breuk
    waarde: { soort: percentage, breuk: "1.20" }
    status: geverifieerd
    bron: &volwassenenfonds
      titel: Gemeente Leiden, Hulp bij kosten sport en cultuur
      url: https://gemeente.leiden.nl/inwoners-en-ondernemers/uitkering-en-inkomen/hulp-bij-laag-inkomen/hulp-bij-kosten-sport-en-cultuur/
      geraadpleegd_op: 2026-11-10
    citaat: &cvolwassenenfonds
      kop: "Gemeente Leiden, Hulp bij kosten sport en cultuur (sport voor volwassenen)"
      tekst: "Volwassenen met een laag inkomen kunnen hulp krijgen van het Volwassenenfonds Sport & Cultuur bij het betalen van de kosten voor sport. […] Een sportactiviteit of culturele activiteit van maximaal € 250,00 per jaar. Hebt u minder dan € 250,00 nodig? Dan kunt u ook sportspullen aanvragen. […] Voor volwassenen met een inkomen tot 120% van het sociaal minimum. […] U maakt een afspraak met een tussenpersoon (intermediair) om een aanvraag te doen."
      versie: "geraadpleegd op 10 november 2026"
    notitie: "De app volgt de tabel van de gemeente: een vast bedrag per soort huishouden, zonder kostendelersnorm. Alleenstaand: 120% van de norm voor een alleenstaande (€ 1.618,18 = 120% × 95% × € 1.419,46); getrouwd of samenwonend: 120% van de norm voor gehuwden (€ 2.311,68); alleenstaand in een instelling: 120% van de norm van art. 23 lid 1 Pw zonder de verhoging van lid 2 (€ 512,36 = 120% × 95% × € 449,44). Voor een paar in een instelling noemt de gemeente geen bedrag; de app geeft dan geen melding. De app vergelijkt de grens met vakantietoeslag met het netto inkomen met vakantiegeld; de gemeente noemt beide zonder vakantiegeld."
