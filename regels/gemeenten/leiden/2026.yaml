    eenheid: breuk
    waarde: { soort: percentage, breuk: "1.10" }
    status: geverifieerd
    bron: &bijzondere_bijstand
      titel: Beleidsregels bijzondere bijstand 2022 gemeente Leiden (CVDR677687)
      url: https://lokaleregelgeving.overheid.nl/CVDR677687
      geraadpleegd_op: 2026-11-08
    notitie: Geldend van 11-06-2022 tot heden (stand 8 november 2026). Bijstandsnorm volgens art. 1 onder d, inclusief een verlaging op grond van art. 27; zonder kostendelersnorm.
    citaat: &cdraag
      kop: "Leiden, beleidsregels bijzondere bijstand 2022, art. 6"
      tekst: "1. Voor de toepassing van dit hoofdstuk hebben de personen, die een inkomen (exclusief vakantietoeslag) hebben tot 110% van de voor hen van toepassing zijnde bijstandsnorm (exclusief vakantietoeslag) en die geen vermogen hebben boven de voor hen in artikel 34, derde lid, van de wet genoemde vermogensgrens geen draagkracht. […] 2. Indien belanghebbende een hoger inkomen heeft dan 110% van de bijstandsnorm wordt de draagkracht vastgesteld op 20% van het meerinkomen tot 130% van de bijstandsnorm, 50% van het meerinkomen tussen 130% en 150% van de bijstandsnorm en 100% van het meerinkomen voor zover dat meer bedraagt dan 150% van de bijstandsnorm."
      versie: "geldend vanaf 1 april 2022"
