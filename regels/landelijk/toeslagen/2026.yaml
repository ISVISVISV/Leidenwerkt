      geraadpleegd_op: 2026-11-21
    citaat: &cvermogen
      kop: "Dienst Toeslagen, vermogen en toeslagen"
      tekst: "Vermogen is de waarde van uw bezittingen min uw schulden. Wat u wel en niet als vermogen moet meetellen, is hetzelfde als bij uw belastingaangifte. Spaargeld, aandelen en een vakantiehuis in Nederland of het buitenland tellen bijvoorbeeld mee. Maar het huis waarin u woont en uw auto tellen niet mee als vermogen. […] Is uw vermogen in 2026 hoger dan € 59.357? Of als u een partner hebt hoger dan € 118.714? Dan hebt u een inkomen uit vermogen. Hierdoor wordt uw toetsingsinkomen hoger, waardoor uw toeslag lager kan worden."
      versie: "geraadpleegd op 21 november 2026"
