name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Regeldata (bronnen, sprongen), unit-, eigenschaps- en proefpersonentests, en of de gegenereerde docs bijgewerkt zijn.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Audit met vaste personen en een vaste rekendatum (audit/README.md). Het rapport staat bij de run.
      # De uitvoer in de repository moet bij de code passen: zo is elke verandering in een uitkomst zichtbaar in de pull request.
      - name: Audit
        run: |
          status=0; npm run audit || status=$?
          cat audit/rapport.md >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- audit/ || { echo "::error::audit/uitvoer of audit/rapport.md is niet bijgewerkt. Draai npm run audit en commit de uitvoer."; exit 1; }
          exit $status
      # Willekeurige personen: elke run andere (het zaad is het runnummer), zodat er steeds nieuwe situaties getest worden.
      - name: Audit met willekeurige personen
        run: |
          status=0; npx tsx scripts/audit.ts --willekeurig 60 --zaad ${{ github.run_number }} || status=$?
          cat audit/rapport-willekeurig.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit
          path: |
            audit/rapport.md
            audit/uitvoer/
            audit/rapport-willekeurig.md
            audit/willekeurig-fouten.json
      - run: npm run build:los
      - uses: actions/upload-artifact@v4
        with:
          name: leidenwerkt-los
          path: app/dist-los/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist

  overzicht:
    # Overzicht van gewijzigde parameters en het effect op de proefpersonen, bij elke pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: basis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run regels
      - name: Overzicht maken
        env:
          BASIS_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npx tsx scripts/pr-overzicht.ts --basis basis > overzicht.md
          cat overzicht.md >> "$GITHUB_STEP_SUMMARY"
      - name: Overzicht bij de pull request plaatsen
        # Bij een pull request vanuit een fork mag de CI niet reageren; het overzicht staat dan in de samenvatting van de run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file overzicht.md --edit-last || gh pr comment "$PR" --body-file overzicht.md

  publiceer:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
