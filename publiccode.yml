description:
  nl:
    shortDescription: Rekenhulp voor inwoners van Leiden met bijstand die willen weten wat werken financieel oplevert.
    longDescription: >
      Leidenwerkt vergelijkt de huidige situatie van een inwoner met bijstand met de situatie na (meer) werken:
      netto loon, bijstand, zorgtoeslag, huurtoeslag, kindgebonden budget, kinderopvangtoeslag en werkkosten.
      Alle berekeningen gebeuren in de browser en zijn herleidbaar tot officiële bronnen.
    features:
      - Vergelijking bijstand en werk per maand en per jaar
      - Uitleg per bedrag met officiële bron
      - Werkt zonder server, ook als één los HTML-bestand
