description:
  nl:
    shortDescription: Twee rekenhulpen voor inwoners van Leiden. Welke regelingen kunt u krijgen? En wat levert werken op?
    longDescription: >
      Leidengeldwijzer laat zien welke regelingen een inwoner van Leiden waarschijnlijk kan krijgen:
      de Sleutelpas en andere regelingen van de gemeente, de toeslagen, de bijstand of de AIO-aanvulling, de
      kinderbijslag en de toeslag van UWV, met de bron bij elke regel.
      Leidenwerkt vergelijkt de huidige situatie van een inwoner met bijstand met de situatie na (meer) werken:
      netto loon, bijstand, zorgtoeslag, huurtoeslag, kindgebonden budget, kinderopvangtoeslag en werkkosten.
      Alle berekeningen gebeuren in de browser en zijn herleidbaar tot officiële bronnen.
    features:
      - Overzicht van regelingen in Leiden, met de kans per regeling
      - Vergelijking bijstand en werk per maand en per jaar
      - Uitleg per bedrag met officiële bron
      - Werkt zonder server, ook als één los HTML-bestand
